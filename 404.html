    <style>
:root {
  --fg: #1e293b;
  --dim: #64748b;
  --quiet: #94a3b8;
  --ghost: #cbd5e1;
  --rail: #eef1f4;
  --card: #ffffff;
  --violet: #7c3aed;
  --violet-deep: #6d28d9;
  --blue: #3b82f6;
  --good: #059669;
  --lift: 0 9px 23px rgba(15, 23, 42, 0.075);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",Helvetica,Arial,sans-serif;
  color:var(--fg);
  background:radial-gradient(1180px 510px at 50% -9%,#f4f2ff 0%,transparent 56%),#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:47px 21px 118px;overflow-x:hidden;position:relative;
}
body::after{
  content:"";position:absolute;inset:auto 0 0 0;height:178px;pointer-events:none;
  background-image:radial-gradient(circle,rgba(124,58,237,.17) 1.2px,transparent 1.4px);
  background-size:13px 13px;
  mask-image:linear-gradient(to top,rgba(0,0,0,.52),transparent 84%);
  -webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.52),transparent 84%);
}
.zv-shell{
  width:100%;max-width:916px;display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:29px;position:relative;z-index:1;
}
.zv-mark{
  width:111px;height:111px;border-radius:999px;background:#fff;box-shadow:var(--lift);
  display:grid;place-items:center;overflow:hidden;
}
.zv-mark svg{width:91%;height:91%;fill:#24292f;transform:scale(1.07)}
.zv-title{font-size:33px;font-weight:700;letter-spacing:-.021em;line-height:1.21}
.zv-note{margin-top:-15px;font-size:15px;color:var(--dim)}
.zv-meter-wrap{width:min(516px,100%);margin-top:7px}
.zv-meter{height:9px;border-radius:999px;background:var(--rail);overflow:hidden}
.zv-meter>i{
  display:block;height:100%;width:0;border-radius:inherit;
  background:linear-gradient(90deg,var(--violet),var(--blue));
  transition:width .17s linear;
}
.zv-cue{
  margin-top:11px;font-size:14px;color:var(--dim);
  display:inline-flex;align-items:center;gap:7px;min-height:21px;
}
.zv-cue .zv-ok{color:var(--good);font-weight:700}
.zv-rail{
  width:100%;margin-top:17px;display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));gap:17px;
}
.zv-cell{
  display:flex;flex-direction:column;align-items:center;gap:9px;
  min-width:0;color:var(--quiet);
}
.zv-tile{
  width:57px;height:57px;border-radius:13px;background:var(--card);box-shadow:var(--lift);
  display:grid;place-items:center;position:relative;color:var(--ghost);
}
.zv-tile svg{
  width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.75;
  stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1;
}
.zv-name{font-size:13px;font-weight:600;color:inherit}
.zv-hash{
  font-size:11px;color:var(--quiet);display:inline-flex;align-items:center;justify-content:center;
  gap:5px;font-variant-numeric:tabular-nums;min-height:14px;max-width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.zv-hash .zv-ok{color:var(--good);font-weight:700}
.zv-cell.off{color:var(--quiet)}
.zv-cell.off .zv-tile{color:var(--ghost)}
.zv-cell.on{color:var(--violet-deep)}
.zv-cell.on .zv-tile{color:var(--violet)}
.zv-cell.on .zv-hash{color:var(--dim)}
.zv-cell.hit{color:#64748b}
.zv-cell.hit .zv-tile{color:#94a3b8}
.zv-cell.hit .zv-hash{color:var(--quiet)}
.zv-cell[data-unit="arm"].on .zv-tile{animation:zvPadBeat 1.05s ease-in-out infinite}
.zv-cell[data-unit="arm"].on .zv-tile::after{
  content:"";position:absolute;inset:-4px;border-radius:17px;
  border:1.5px solid rgba(124,58,237,.42);animation:zvRimFlash 1.05s ease-in-out infinite;
}
@keyframes zvPadBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@keyframes zvRimFlash{0%,100%{opacity:.32}50%{opacity:1}}
.zv-beam{
  display:none;position:absolute;left:9px;right:9px;height:2px;border-radius:2px;
  background:linear-gradient(90deg,transparent,var(--violet),transparent);z-index:2;
  animation:zvBeamSweep 1.2s linear infinite;
}
.zv-cell[data-unit="test"].on .zv-beam{display:block}
@keyframes zvBeamSweep{0%{top:9px;opacity:0}15%{opacity:1}85%{opacity:1}100%{top:45px;opacity:0}}
.zv-orbit{display:none;position:absolute;inset:-11px;pointer-events:none}
.zv-orbit .a,.zv-orbit .b{position:absolute;inset:0;border-radius:999px;border:2px dashed rgba(124,58,237,.33)}
.zv-orbit .b{
  inset:6px;border-style:solid;border-color:transparent;
  border-top-color:rgba(124,58,237,.52);border-right-color:rgba(124,58,237,.18);
}
.zv-cell[data-unit="make"].on .zv-orbit{display:block}
.zv-cell[data-unit="make"].on .zv-orbit .a{animation:zvTurnR 3.4s linear infinite}
.zv-cell[data-unit="make"].on .zv-orbit .b{animation:zvTurnL 5.1s linear infinite}
.zv-cell[data-unit="make"].on .zv-tile svg{animation:zvBoxThrob 1.35s ease-in-out infinite}
@keyframes zvTurnR{to{transform:rotate(360deg)}}
@keyframes zvTurnL{to{transform:rotate(-360deg)}}
@keyframes zvBoxThrob{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.055);opacity:.82}}
.zv-pulse{display:none;gap:5px;align-items:center;height:12px}
.zv-cell[data-unit="make"].on .zv-pulse{display:inline-flex}
.zv-pulse i{width:5px;height:5px;border-radius:50%;background:#ddd6fe}
.zv-pulse i.zv-hot{background:var(--violet)}
.zv-lanes{
  display:none;position:absolute;left:17px;right:17px;top:13px;bottom:13px;
  flex-direction:column;justify-content:space-between;z-index:2;pointer-events:none;
}
.zv-lanes b{display:block;height:3px;border-radius:2px;background:rgba(124,58,237,.16)}
.zv-cell[data-unit="grab"].on .zv-lanes{display:flex}
.zv-cell[data-unit="grab"].on .zv-lanes b{animation:zvLaneFlash .95s ease-in-out infinite}
.zv-cell[data-unit="grab"].on .zv-lanes b:nth-child(2){animation-delay:.14s}
.zv-cell[data-unit="grab"].on .zv-lanes b:nth-child(3){animation-delay:.28s}
.zv-cell[data-unit="grab"].on .zv-lanes b:nth-child(4){animation-delay:.42s}
@keyframes zvLaneFlash{0%,100%{background:rgba(124,58,237,.14)}50%{background:rgba(124,58,237,.82)}}
.zv-arc{display:none;position:absolute;inset:7px;z-index:0}
.zv-arc svg{width:100%;height:100%}
.zv-arc .base{stroke:#ede9fe;fill:none;stroke-width:2.4}
.zv-arc .run{
  stroke:var(--violet);fill:none;stroke-width:2.4;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:100;transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset .14s linear;
}
.zv-whirl{
  display:none;position:absolute;inset:13px;border-radius:999px;border:2px solid transparent;
  border-top-color:rgba(124,58,237,.52);animation:zvTurnR .95s linear infinite;z-index:0;
}
.zv-cell[data-unit="end"].on .zv-arc,
.zv-cell[data-unit="end"].on .zv-whirl{display:block}
@media (max-width:860px){
  .zv-title{font-size:27px}
  .zv-rail{grid-template-columns:repeat(2,minmax(0,1fr));gap:21px 13px}
  .zv-cell:last-child{grid-column:1/-1}
}
@media (max-width:480px){
  .zv-rail{grid-template-columns:1fr}
  .zv-cell:last-child{grid-column:auto}
  .zv-title{font-size:23px}
}

        });
    }

    zvEnter(0);

    (async function zvPlay() {
        await zvPause(WAIT[0]);
        zvLeave();
        zvEnter(1);

        await zvPause(WAIT[1]);
        zvLeave();
        zvEnter(2);

        await zvPause(WAIT[2]);
        zvLeave();
        zvEnter(3);

        while (zvGot < need) await zvPause(28);
        await zvPause(70);
        zvLeave();
        zvEnter(4);

        await zvPause(WAIT[3]);
        await zvSeal();
    })();
})();
</script>
